services:
  nids:
    build: .
    container_name: nids
    ports:
      - "5000:5000"
    environment:
      - NIDS_HOST=0.0.0.0
      - NIDS_PORT=5000
      - NIDS_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
