<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIDS · 网络入侵检测系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #2d333b;
    --text: #e6edf3; --muted: #8b949e;
    --critical: #f85149; --high: #f0883e; --medium: #d29922;
    --info: #3fb950; --accent: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
  header { padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 20px 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat .num { font-size: 30px; font-weight: 600; margin-top: 4px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .charts { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; padding: 0 28px 20px; }
  .card h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 10px; }
  .table-wrap { padding: 0 28px 28px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .badge.critical { background: rgba(248,81,73,.15); color: var(--critical); }
  .badge.high { background: rgba(240,136,62,.15); color: var(--high); }
  .badge.medium { background: rgba(210,153,34,.15); color: var(--medium); }
  .badge.info { background: rgba(63,185,80,.15); color: var(--info); }
  .engine { color: var(--muted); font-size: 12px; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 0 28px 14px; }
  button { background: var(--accent); color: #0d1117; border: none; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  #liveDot { width: 9px; height: 9px; border-radius: 50%; background: var(--info); display: inline-block; margin-right: 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  .conf-bar { height: 5px; border-radius: 3px; background: var(--border); width: 80px; }
  .conf-fill { height: 100%; border-radius: 3px; background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>网络入侵检测系统</h1>
  <span class="sub">双引擎架构 · 规则引擎 + Isolation Forest / Random Forest · 实时流量监控</span>
</header>

<div class="grid">
  <div class="card stat"><div class="label">已检测连接</div><div class="num" id="statTotal">0</div></div>
  <div class="card stat"><div class="label">攻击警告</div><div class="num" id="statAttack" style="color:var(--critical)">0</div></div>
  <div class="card stat"><div class="label">检测准确率（测试集）</div><div class="num" id="statAcc">—</div></div>
  <div class="card stat"><div class="label">当前检测速率</div><div class="num" id="statRate">0<small style="font-size:13px;color:var(--muted)"> 条/批</small></div></div>
</div>

<div class="toolbar">
  <button id="btnSimulate">注入一批流量（20 条）</button>
  <button class="ghost" id="btnLive"><span id="liveDot"></span>持续监控：开</button>
  <span class="muted" id="lastInfo"></span>
</div>

<div class="charts">
  <div class="card"><h3>实时流量检测趋势（每批攻击占比）</h3><div style="height:220px;position:relative"><canvas id="trendChart"></canvas></div></div>
  <div class="card"><h3>攻击类型分布</h3><div style="height:220px;position:relative"><canvas id="pieChart"></canvas></div></div>
</div>

<div class="table-wrap">
  <div class="card">
    <h3>实时警告与检测日志</h3>
    <table>
      <thead><tr>
        <th>时间</th><th>源 IP</th><th>目的 IP:端口</th><th>判定</th><th>严重级别</th>
        <th>置信度</th><th>检测引擎</th><th>命中规则 / 异常分</th>
      </tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
